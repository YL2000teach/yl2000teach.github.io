<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>פתיחת שיעור חי</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
<script src="api.js"></script>
<script src="qrcode.js"></script>
<style>
  body { --bg: #ffffff; --ink: #232752; --accent: #ffc926; --on-accent: #232752; --line: #e3e4ea; --muted: #6b6e88; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 22px 60px; }
  h1 { font-size: 28px; margin: 0 0 24px; }
  label { display: block; font-weight: 700; margin: 18px 0 8px; font-size: 16px; }
  select, input { width: 100%; font-size: 18px; padding: 12px; border: 2px solid var(--line); border-radius: var(--radius); background: #fff; color: var(--ink); }
  input { direction: ltr; text-align: left; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .out { margin-top: 28px; display: grid; grid-template-columns: 1fr 200px; gap: 24px; align-items: start; }
  .link { border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .link .t { font-weight: 700; margin-bottom: 6px; }
  .link .u { direction: ltr; text-align: left; font-size: 14px; color: var(--muted); word-break: break-all; margin-bottom: 10px; }
  .link button, .open { border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 8px 14px; font-size: 15px; margin-inline-end: 8px; }
  .open { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 17px; padding: 12px 18px; }
  .qrbox { text-align: center; border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .qrbox svg { width: 100%; height: auto; display: block; }
  .qrbox div { font-size: 14px; font-weight: 700; margin-top: 6px; }
  .status { margin-top: 12px; min-height: 1.4em; color: var(--ink); }
  @media (max-width: 640px) { .out { grid-template-columns: 1fr; } .qrbox { max-width: 220px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>פתיחת שיעור חי</h1>

  <label for="lesson">שיעור</label>
  <select id="lesson"><option>טוען...</option></select>

  <label for="session">שם מפגש</label>
  <input id="session" maxlength="40" placeholder="11a-1112">
  <div class="hint">אותיות לועזיות, ספרות ומקף. שם חדש מתחיל מפגש נקי. אותו שם ממשיך מאיפה שעצרתם.</div>

  <div class="out" id="out">
    <div>
      <div class="link">
        <div class="t">תוצאות (מחשב הכיתה)</div>
        <div class="u" id="showUrl"></div>
        <button data-copy="showUrl">העתקה</button>
      </div>
      <div class="link">
        <div class="t">שלט (הטלפון שלך)</div>
        <div class="u" id="ctlUrl"></div>
        <button data-copy="ctlUrl">העתקה</button>
      </div>
      <button class="open" id="openShow">פתיחת התוצאות</button>
    </div>
    <div class="qrbox">
      <div id="ctlQr"></div>
      <div>סרקי כדי לפתוח את השלט</div>
    </div>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var base = new URL('./', location.href).href;

  function cleanSession(v) { return String(v || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40); }

  function defaultSession() {
    var d = new Date();
    return 'class-' + ('0' + d.getDate()).slice(-2) + ('0' + (d.getMonth() + 1)).slice(-2);
  }

  function update() {
    var deck = $('lesson').value;
    var s = cleanSession($('session').value) || defaultSession();
    if (!deck) return;
    store.set('start:deck', deck);
    store.set('start:session', $('session').value);
    var q = '?d=' + encodeURIComponent(deck) + '&s=' + encodeURIComponent(s);
    var show = base + q, ctl = base + 'c.html' + q;
    $('showUrl').textContent = show;
    $('ctlUrl').textContent = ctl;
    var qr = qrcode(0, 'M');
    qr.addData(ctl);
    qr.make();
    $('ctlQr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
  }

  function copy(id) {
    var text = $(id).textContent;
    var done = function () { $('status').textContent = 'הקישור הועתק'; setTimeout(function () { $('status').textContent = ''; }, 2000); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { $('status').textContent = 'סמני את הקישור והעתיקי ידנית'; }
      document.body.removeChild(ta);
    }
  }

  document.querySelectorAll('[data-copy]').forEach(function (b) { b.onclick = function () { copy(b.getAttribute('data-copy')); }; });
  $('openShow').onclick = function () { window.open($('showUrl').textContent, '_blank'); };
  $('lesson').onchange = update;
  $('session').oninput = update;

  $('session').value = store.get('start:session') || '';
  $('session').placeholder = defaultSession();

  call('lessons').then(function (list) {
    var sel = $('lesson');
    sel.innerHTML = '';
    if (!list.length) { sel.innerHTML = '<option value="">אין שיעורים בגיליון</option>'; return; }
    list.forEach(function (l) {
      var o = document.createElement('option');
      o.value = l.deck;
      o.textContent = l.title + ' (' + l.deck + ', ' + l.count + ' שאלות)';
      sel.appendChild(o);
    });
    var last = store.get('start:deck');
    if (last && list.some(function (l) { return l.deck === last; })) sel.value = last;
    update();
  }).catch(function (e) {
    $('status').textContent = 'שגיאה בטעינת השיעורים: ' + errText(e);
  });
</script>
</body>
</html>
