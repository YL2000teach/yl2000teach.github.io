<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>הצבעה</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
<script src="api.js"></script>
<style>
  .phone { max-width: 520px; margin: 0 auto; padding: 22px 18px 40px; }
  header { color: var(--muted); font-size: 14px; margin-bottom: 18px; display: flex; justify-content: space-between; gap: 10px; }
  h1 { font-size: 22px; line-height: 1.35; margin: 0 0 8px; }
  .ctx { color: var(--muted); font-size: 15px; margin: 0 0 20px; }
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; font-size: 18px; text-align: right; color: var(--ink); }
  .opt.chosen { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  textarea { width: 100%; min-height: 96px; font-size: 17px; padding: 12px; border: 2px solid var(--line); border-radius: var(--radius); resize: vertical; direction: rtl; }
  .send { margin-top: 12px; width: 100%; background: var(--accent); color: var(--on-accent); font-weight: 700; border: none; border-radius: var(--radius); padding: 14px; font-size: 18px; }
  .send:disabled, .opt:disabled { opacity: .6; }
  .status { margin-top: 16px; font-size: 15px; color: var(--ink); min-height: 1.4em; }
  .opts.scale { flex-direction: row; gap: 8px; direction: ltr; }
  .scale .opt { flex: 1; text-align: center; padding: 16px 0; font-size: 20px; }
  .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-top: 8px; direction: ltr; }
  input.field { width: 100%; font-size: 22px; padding: 12px; border: 2px solid var(--line); border-radius: var(--radius); text-align: center; }
  .unit { color: var(--muted); font-size: 15px; margin-top: 6px; text-align: center; }
  .waiting { text-align: center; color: var(--muted); padding: 60px 0; font-size: 18px; }
</style>
</head>
<body>
<main class="phone">
  <header><span id="deck"></span><span id="pos"></span></header>
  <div id="view"><div class="waiting">מתחבר...</div></div>
  <div class="status" id="status"></div>
</main>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var shownKey = null, view = null, sending = false;

  // מזהה אקראי למכשיר. לא מכיל שום פרט אישי.
  var voter = store.get('live:voter');
  if (!voter) {
    var a = new Uint8Array(12);
    crypto.getRandomValues(a);
    voter = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    store.set('live:voter', voter);
  }
  function mineKey(qid) { return 'live:my:' + view.deck + ':' + BOOT.session + ':' + qid; }

  function setStatus(t, isErr) {
    $('status').textContent = t;
    $('status').classList.toggle('err', !!isErr);
  }

  function render() {
    var q = view.question;
    var key = q ? q.id + ':' + view.open : 'none';
    if (key === shownKey) return;
    shownKey = key;
    var box = $('view');
    box.innerHTML = '';
    setStatus('');
    $('pos').textContent = q ? 'שאלה ' + (view.index + 1) : '';
    if (!q) { box.innerHTML = '<div class="waiting">ממתינים לשאלה הראשונה</div>'; return; }
    if (!view.open) { box.innerHTML = '<div class="waiting">ההצבעה על השאלה הזו סגורה</div>'; return; }

    var h = document.createElement('h1');
    h.textContent = q.title;
    box.appendChild(h);
    if (q.context) {
      var p = document.createElement('p');
      p.className = 'ctx';
      p.textContent = q.context;
      box.appendChild(p);
    }
    var mine = store.get(mineKey(q.id));

    if (q.type === 'choice') {
      var opts = document.createElement('div');
      opts.className = 'opts';
      q.options.forEach(function (o) {
        opts.appendChild(optButton(q, o, o, mine, opts));
      });
      box.appendChild(opts);
    } else if (q.type === 'scale') {
      var row = document.createElement('div');
      row.className = 'opts scale';
      for (var v = q.min; v <= q.max; v++) row.appendChild(optButton(q, String(v), String(v), mine, row));
      box.appendChild(row);
      if (q.lowLabel || q.highLabel) {
        var ends = document.createElement('div');
        ends.className = 'ends';
        var a = document.createElement('span'); a.textContent = q.lowLabel || '';
        var b2 = document.createElement('span'); b2.textContent = q.highLabel || '';
        ends.appendChild(a); ends.appendChild(b2);
        box.appendChild(ends);
      }
    } else if (q.type === 'number') {
      var inp = document.createElement('input');
      inp.className = 'field';
      inp.type = 'text';
      inp.inputMode = 'decimal';
      inp.placeholder = 'מספר';
      inp.value = mine || '';
      box.appendChild(inp);
      if (q.unit) {
        var u = document.createElement('div'); u.className = 'unit'; u.textContent = q.unit; box.appendChild(u);
      }
      box.appendChild(sendButton(q, inp, mine, function (v) {
        var x = Number(String(v).replace(',', '.'));
        if (!isFinite(x)) return 'צריך לכתוב מספר';
        if (q.min !== null && x < q.min) return 'המספר צריך להיות לפחות ' + q.min;
        if (q.max !== null && x > q.max) return 'המספר צריך להיות לכל היותר ' + q.max;
        return '';
      }));
    } else if (q.type === 'cloud') {
      var w = document.createElement('input');
      w.className = 'field';
      w.type = 'text';
      w.maxLength = 30;
      w.placeholder = 'מילה אחת או שתיים';
      w.value = mine || '';
      box.appendChild(w);
      box.appendChild(sendButton(q, w, mine));
    } else {
      var ta = document.createElement('textarea');
      ta.maxLength = 200;
      ta.placeholder = 'התשובה שלך';
      ta.value = mine || '';
      box.appendChild(ta);
      box.appendChild(sendButton(q, ta, mine));
    }
    if (mine) setStatus('התשובה שלך נשמרה. אפשר לשנות עד שההצבעה תיסגר.');
  }

  function optButton(q, value, label, mine, group) {
    var b = document.createElement('button');
    b.className = 'opt' + (mine === value ? ' chosen' : '');
    b.textContent = label;
    b.onclick = function () {
      send(q, value, function () {
        Array.prototype.forEach.call(group.children, function (x) { x.classList.remove('chosen'); });
        b.classList.add('chosen');
      });
    };
    return b;
  }

  function sendButton(q, input, mine, check) {
    var b = document.createElement('button');
    b.className = 'send';
    b.textContent = mine ? 'עדכון התשובה' : 'שליחה';
    b.onclick = function () {
      var v = input.value.trim();
      if (!v) return setStatus('התשובה ריקה', true);
      var problem = check ? check(v) : '';
      if (problem) return setStatus(problem, true);
      send(q, v, function () { b.textContent = 'עדכון התשובה'; });
    };
    return b;
  }

  function send(q, value, onOk) {
    if (sending) return;
    sending = true;
    setStatus('שולח...');
    call('vote', view.deck, BOOT.session, q.id, voter, value).then(function (r) {
      sending = false;
      if (!r.ok) return setStatus(r.msg, true);
      store.set(mineKey(q.id), value);
      onOk();
      setStatus('התשובה שלך נשמרה. אפשר לשנות עד שההצבעה תיסגר.');
    }).catch(function () {
      sending = false;
      setStatus('התשובה לא נשלחה. נסו שוב.', true);
    });
  }

  function poll() {
    call('voteView', BOOT.deck, BOOT.session).then(function (v) {
      var first = !view;
      view = v;
      if (first) { applyTheme(v.theme); $('deck').textContent = v.title; }
      render();
      setTimeout(poll, 4000);
    }).catch(function (e) {
      if (!view) $('view').innerHTML = '<div class="waiting err"></div>';
      if (!view) $('view').firstChild.textContent = 'שגיאה: ' + errText(e);
      setTimeout(poll, 6000);
    });
  }
  poll();
</script>
</body>
</html>
